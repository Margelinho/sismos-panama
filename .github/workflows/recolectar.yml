name: Recolectar sismos

on:
  schedule:
    - cron: '17 */4 * * *'   # cada 4 horas, en el minuto 17 (hora UTC)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar sismos nuevos
        run: python scripts/recolectar.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sismos.csv
          git diff --staged --quiet || git commit -m "Datos: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
